name: CI

on:
  pull_request:
    branches: [ main, revamp ]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go mod download
      - run: go mod verify
      - run: go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Wire drift
        run: |
          if [ -f internal/pascalallen/infrastructure/container/wire.go ]; then
            go generate ./...
          else
            go run github.com/google/wire/cmd/wire@v0.7.0 ./cmd/pascalallen
          fi
          git diff --exit-code -- '*wire_gen.go'
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
